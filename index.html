<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجموعة النخبة سفر — صمم رحلتك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0e2a47; --navy-deep:#081a2e;
  --gold:#c9a227; --gold-soft:#e8d18f;
  --bg:#f7f4ec; --card:#ffffff; --text:#16233a; --muted:#5c6b83; --line:#e4ddc9;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0b1626;--card:#101f36;--text:#eef1f6;--muted:#9fb0c8;--line:#22344f;}
}
:root[data-theme="dark"]{--bg:#0b1626;--card:#101f36;--text:#eef1f6;--muted:#9fb0c8;--line:#22344f;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Cairo',sans-serif;line-height:1.6;min-height:100%}
h1,h2,h3,.brand{font-family:'Tajawal',sans-serif}
header{background:var(--navy-deep);color:#fff;padding:22px 18px 20px;text-align:center;position:relative}
header .brand{font-size:1.5rem;font-weight:900;letter-spacing:.5px}
header .brand span{color:var(--gold)}
header p{margin:6px 0 0;color:#c7d3e3;font-size:.92rem}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 60px}
.progress{display:flex;gap:6px;margin:18px 0}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 18px;margin-top:10px}
h2.step-title{margin:0 0 4px;font-size:1.25rem}
.step-sub{color:var(--muted);font-size:.88rem;margin:0 0 18px}
label.field{display:block;margin-bottom:16px}
label.field>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
select,input[type=text],input[type=number],input[type=date]{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font-family:inherit;font-size:.95rem}
.choice-row{display:flex;gap:8px;flex-wrap:wrap}
.choice{border:1px solid var(--line);border-radius:9px;padding:10px 14px;cursor:pointer;font-size:.9rem;background:var(--bg);user-select:none;flex:1;text-align:center;min-width:110px}
.choice.on{border-color:var(--gold);background:rgba(201,162,39,.14);font-weight:700}
.count{display:flex;align-items:center;gap:10px}
.count button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1.1rem;cursor:pointer}
.count output{min-width:28px;text-align:center;font-weight:700}
.country-block{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.country-head{font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:6px}
.city-row{display:flex;flex-wrap:wrap;gap:7px}
.city-chip{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:.85rem;cursor:pointer}
.city-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.pkg-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pkg{border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;text-align:center}
.pkg.on{border-color:var(--gold);background:rgba(201,162,39,.14)}
.pkg b{display:block;font-size:1.1rem}
.pkg small{color:var(--muted)}
.day-editor{margin-top:14px}
.day-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.day-row input{width:64px;text-align:center}
.day-total{font-size:.85rem;color:var(--muted);margin-top:8px}
.day-total.bad{color:#c0392b;font-weight:700}
.pref-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.nav-btns{display:flex;gap:10px;margin-top:22px}
button.primary{flex:1;background:var(--navy);color:#fff;border:none;padding:13px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer}
button.primary:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:none;border:1px solid var(--line);color:var(--text);padding:13px 18px;border-radius:10px;cursor:pointer;font-weight:600}
.summary-block{margin-bottom:16px}
.summary-block h3{margin:0 0 8px;font-size:1rem;color:var(--gold)}
.summary-row{display:flex;justify-content:space-between;font-size:.92rem;padding:5px 0;border-bottom:1px solid var(--line)}
.itin-city{display:flex;justify-content:space-between;padding:6px 0;font-size:.92rem}
.itin-city b{color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .itin-city b{color:var(--gold)}}
:root[data-theme="dark"] .itin-city b{color:var(--gold)}
.note{background:rgba(201,162,39,.12);border:1px solid var(--gold-soft);border-radius:9px;padding:10px 12px;font-size:.85rem;margin-top:10px}
.subhead{font-weight:700;font-size:.95rem;margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.subhead:first-of-type{border-top:none;padding-top:0;margin-top:0}
.visa-box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
.visa-row{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;padding:5px 0}
.visa-tag{font-size:.78rem;padding:3px 9px;border-radius:20px;font-weight:700}
.visa-free{background:rgba(46,139,87,.15);color:#2e8b57}
.visa-arrival{background:rgba(201,162,39,.18);color:#9a7b1a}
.visa-req{background:rgba(192,57,43,.14);color:#c0392b}
.budget-box{border:1px dashed var(--gold-soft);border-radius:10px;padding:12px;margin-top:16px}
.budget-box .btitle{font-weight:700;font-size:.9rem;margin-bottom:8px}
.tier-row{display:flex;gap:6px}
.tier{flex:1;text-align:center;padding:8px 4px;border-radius:8px;background:var(--bg);font-size:.78rem;color:var(--muted)}
.tier.active{background:var(--navy);color:#fff;font-weight:700}
.tier b{display:block;font-size:.95rem}
.transport-block{margin-top:10px}
.transport-block .tb-title{font-weight:600;font-size:.88rem;margin-bottom:6px}
.addon-grid{display:flex;flex-direction:column;gap:8px}
.addon{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:10px 12px;cursor:pointer;font-size:.88rem}
.addon.on{border-color:var(--gold);background:rgba(201,162,39,.1)}
.addon .box{width:18px;height:18px;border:2px solid var(--muted);border-radius:5px;flex:none}
.addon.on .box{background:var(--gold);border-color:var(--gold)}
.wa-btn{background:#25D366;color:#fff}
.summary-tags{font-size:.85rem;color:var(--muted)}
@media print{header,.progress,.nav-btns{display:none!important}.wrap{padding:0}.card{border:none}}
</style>
</head>
<body>
<header>
  <div class="brand">مجموعة النخبة <span>سفر</span></div>
  <p>صمم رحلتك خطوة بخطوة</p>
</header>
<div class="wrap">
  <div class="progress" id="progress"></div>
  <div class="card" id="stepCard"></div>
</div>

<script>
const DESTS = {
  "مصر": ["القاهرة","شرم الشيخ","الغردقة"],
  "تونس": ["سوسة","جربة","الحمامات","قمرت","تونس العاصمة"],
  "تركيا": ["إسطنبول","طرابزون","أنطاليا"],
  "إندونيسيا": ["جاكرتا","بالي"],
  "ماليزيا": ["كوالالمبور","لنكاوي"],
  "تايلاند": ["بانكوك","بوكيت"]
};
const PACKAGES = [ {days:10,tours:3}, {days:18,tours:5}, {days:23,tours:8}, {days:30,tours:10} ];
const NATIONALITIES = ["مصرية","سعودية","إماراتية","ليبية","تونسية","جزائرية","مغربية","أردنية","كويتية","قطرية","بحرينية","عمانية","أخرى"];
const STAY_TYPES = ["فندق بسيط","منتجع Resort","فيلا خاصة","كوخ خشبي Cottage"];
const ADDONS = ["شريحة إنترنت دولية (eSIM)","مقعد أطفال في السيارة","تأمين سفر شامل","تجهيزات شهر العسل والمناسبات"];
const TRANSPORT_MODES = ["طيران داخلي","سيارة خاصة وسائق","عبّارة بحرية"];
const PHONE_NUMBERS = [
  {label:"الرقم الأول", number:"218915919921"},
  {label:"الرقم الثاني", number:"218910613800"}
];
const VISA_RULES = {
  "مصر":{tag:"visa-arrival",label:"تأشيرة عند الوصول"},
  "تونس":{tag:"visa-free",label:"بدون تأشيرة"},
  "تركيا":{tag:"visa-req",label:"تتطلب تأشيرة إلكترونية مسبقة"},
  "إندونيسيا":{tag:"visa-arrival",label:"تأشيرة عند الوصول"},
  "ماليزيا":{tag:"visa-free",label:"بدون تأشيرة"},
  "تايلاند":{tag:"visa-free",label:"بدون تأشيرة (حتى 30 يوم)"}
};

let step = 1;
const TOTAL_STEPS = 6;
const s = {
  nationality:"", tripType:"", adults:2, children:0,
  cities:[],
  origin:"", flightClass:"اقتصادية", startDate:"",
  package:null, dayMap:{}, transport:{},
  reception:null, stayTypes:[], starsSel:[], addons:[],
  guideLang:"", tourType:"",
  budget:1500,
  prefs:[]
};

function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}
function renderProgress(){
  const p=document.getElementById('progress'); p.innerHTML='';
  for(let i=1;i<=TOTAL_STEPS;i++){const b=el(`<i class="${i<=step?'on':''}"></i>`);p.appendChild(b);}
}
function cityList(){return s.cities;}
function evenDistribute(days,n){
  const base=Math.floor(days/n), extra=days%n, out=[];
  for(let i=0;i<n;i++) out.push(base+(i<extra?1:0));
  return out;
}
function ensureDayMap(){
  const cities=cityList();
  if(!s.package||cities.length===0) return;
  const arr=evenDistribute(s.package.days,cities.length);
  cities.forEach((c,i)=>{ if(s.dayMap[c]===undefined) s.dayMap[c]=arr[i]; });
  Object.keys(s.dayMap).forEach(k=>{ if(!cities.includes(k)) delete s.dayMap[k]; });
}
function dayTotal(){ return cityList().reduce((a,c)=>a+(+s.dayMap[c]||0),0); }
function toursFor(city){
  if(!s.package) return 0;
  const total=dayTotal()||1;
  return Math.max(1, Math.round((s.dayMap[city]/total)*s.package.tours));
}

function countryOf(city){ return Object.keys(DESTS).find(k=>DESTS[k].includes(city)); }
function selectedCountries(){ return [...new Set(cityList().map(countryOf))]; }
function multiCityCountries(){
  const map={}; cityList().forEach(c=>{const k=countryOf(c); (map[k]=map[k]||[]).push(c);});
  return Object.entries(map).filter(([,v])=>v.length>1);
}
const STAY_FACTOR={"فندق بسيط":1,"منتجع Resort":1.3,"فيلا خاصة":1.6,"كوخ خشبي Cottage":1.15};
function estimateBudget(){
  const days=s.package?s.package.days:10;
  const pax=Math.max(1,s.adults+s.children);
  const flightPerPerson = s.flightClass==="رجال أعمال"?1400:420;
  const avgStar = s.starsSel.length? s.starsSel.reduce((a,b)=>a+b,0)/s.starsSel.length : 4;
  const avgFactor = s.stayTypes.length? s.stayTypes.reduce((a,t)=>a+(STAY_FACTOR[t]||1),0)/s.stayTypes.length : 1.15;
  const nightly = 22*avgStar*avgFactor;
  const rooms = Math.ceil(pax/2);
  const stayCost = nightly*days*rooms;
  const toursCost = (s.package?s.package.tours:3) * 35 * pax * (s.tourType==="جولات خاصة Private"?1.6:1);
  const addonCost = s.addons.length*40*pax;
  const total = flightPerPerson*pax + stayCost + toursCost + addonCost;
  const perPersonPerDay = total/pax/days;
  let tier = perPersonPerDay<90?"اقتصادي":perPersonPerDay<180?"متوسط":"فاخر";
  return {total:Math.round(total/50)*50, tier};
}
function budgetWidgetHTML(){
  const b=estimateBudget();
  return `<div class="budget-box"><div class="btitle">تقدير الميزانية الإجمالية (تقريبي)</div>
    <div class="tier-row">
      <div class="tier ${b.tier==='اقتصادي'?'active':''}">اقتصادي</div>
      <div class="tier ${b.tier==='متوسط'?'active':''}">متوسط</div>
      <div class="tier ${b.tier==='فاخر'?'active':''}">فاخر</div>
    </div>
    <div style="margin-top:8px;font-size:1.05rem;font-weight:800;color:var(--navy)">≈ $${b.total.toLocaleString()}</div>
    <div style="font-size:.78rem;color:var(--muted)">تقدير تقريبي غير نهائي — السعر الفعلي يُحدد من فريقنا</div>
  </div>`;
}
function buildWhatsAppMessage(){
  const cities=cityList();
  let msg = `مرحباً مجموعة النخبة سفر، أرغب في عرض سعر لرحلتي:\n\n`;
  msg += `الجنسية: ${s.nationality}\nنوع الرحلة: ${s.tripType}\nعدد المسافرين: ${s.adults} بالغين، ${s.children} أطفال\nالميزانية المخصصة من العميل: $${(+s.budget).toLocaleString()}\n\n`;
  msg += `الوجهات:\n${cities.map(c=>`- ${c} (${s.dayMap[c]} أيام)`).join('\n')}\n\n`;
  msg += `الانطلاق من: ${s.origin}\nدرجة الطيران: ${s.flightClass}\nتاريخ البداية: ${s.startDate}\nالباكج: ${s.package.days} يوم\n\n`;
  msg += `الإقامة: ${s.stayTypes.join('، ')} — ${s.starsSel.map(n=>n+'⭐').join('، ')}\nالاستقبال بالمطار: ${s.reception?'نعم':'لا'}\n`;
  if(s.addons.length) msg += `خدمات إضافية: ${s.addons.join('، ')}\n`;
  if(s.guideLang) msg += `لغة المرشد: ${s.guideLang}\n`;
  if(s.tourType) msg += `نوع الجولات: ${s.tourType}\n`;
  if(s.prefs.length) msg += `التفضيلات: ${s.prefs.join('، ')}\n`;
  msg += `\nالميزانية التقديرية: ≈$${estimateBudget().total.toLocaleString()} (${estimateBudget().tier})`;
  return msg;
}

function go(dir){
  if(dir>0 && !validate()) return;
  step=Math.max(1,Math.min(TOTAL_STEPS,step+dir));
  render();
}
function validate(){
  if(step===1) return s.nationality && s.tripType;
  if(step===2) return s.cities.length>0;
  if(step===3){ if(!s.origin||!s.startDate||!s.package) return false; ensureDayMap(); return dayTotal()===s.package.days; }
  if(step===4) return s.reception!==null && s.stayTypes.length>0 && s.starsSel.length>0;
  return true;
}

function render(){
  renderProgress();
  const card=document.getElementById('stepCard');
  card.innerHTML = step===1?step1(): step===2?step2(): step===3?step3(): step===4?step4(): step===5?step5(): step6();
  wire();
  window.scrollTo({top:0,behavior:'auto'});
}

function step1(){
  return `
  <h2 class="step-title">بيانات الرحلة الأساسية</h2>
  <p class="step-sub">الخطوة 1 من 6</p>
  <label class="field"><span>الجنسية</span>
    <select id="nat"><option value="">اختر الجنسية</option>${NATIONALITIES.map(n=>`<option ${s.nationality===n?'selected':''}>${n}</option>`).join('')}</select>
  </label>
  <label class="field"><span>نوع الرحلة</span>
    <div class="choice-row" id="tripType">
      ${["شهر عسل","رحلة شبابية","رحلة عائلية"].map(t=>`<div class="choice ${s.tripType===t?'on':''}" data-v="${t}">${t}</div>`).join('')}
    </div>
  </label>
  <label class="field"><span>عدد البالغين</span>
    <div class="count"><button data-adj="adults" data-d="-1">−</button><output>${s.adults}</output><button data-adj="adults" data-d="1">+</button></div>
  </label>
  <label class="field"><span>عدد الأطفال</span>
    <div class="count"><button data-adj="children" data-d="-1">−</button><output>${s.children}</output><button data-adj="children" data-d="1">+</button></div>
  </label>
  <label class="field"><span>الميزانية المخصصة للرحلة (تبدأ من 1500$)</span>
    <input type="number" id="budget" min="1500" step="100" value="${s.budget}">
  </label>
  <div class="nav-btns"><button class="primary" id="next" ${(!s.nationality||!s.tripType)?'disabled':''}>التالي</button></div>`;
}

function step2(){
  return `
  <h2 class="step-title">الوجهات والمدن</h2>
  <p class="step-sub">يمكنك اختيار أكثر من دولة ومدينة — الخطوة 2 من 6</p>
  ${Object.entries(DESTS).map(([country,cities])=>`
    <div class="country-block">
      <div class="country-head">${country}</div>
      <div class="city-row">${cities.map(c=>`<div class="city-chip ${s.cities.includes(c)?'on':''}" data-c="${c}">${c}</div>`).join('')}</div>
    </div>`).join('')}
  ${s.nationality && selectedCountries().length? `<div class="visa-box">
    <div style="font-weight:700;font-size:.9rem;margin-bottom:6px">حالة التأشيرة المتوقعة لجنسية "${s.nationality}"</div>
    ${selectedCountries().map(c=>{const v=VISA_RULES[c];return `<div class="visa-row"><span>${c}</span><span class="visa-tag ${v.tag}">${v.label}</span></div>`;}).join('')}
    <div style="font-size:.76rem;color:var(--muted);margin-top:4px">تقديري — يُرجى تأكيد المتطلبات مع السفارة قبل الحجز</div>
  </div>`:''}
  <div class="nav-btns"><button class="ghost" id="back">رجوع</button><button class="primary" id="next" ${s.cities.length===0?'disabled':''}>التالي</button></div>`;
}

function step3(){
  ensureDayMap();
  const cities=cityList();
  const total=dayTotal();
  return `
  <h2 class="step-title">الطيران والباكج</h2>
  <p class="step-sub">الخطوة 3 من 6</p>
  <label class="field"><span>مدينة الانطلاق</span><input type="text" id="origin" value="${s.origin}" placeholder="مثال: القاهرة"></label>
  <label class="field"><span>درجة الطيران</span>
    <div class="choice-row">${["اقتصادية","رجال أعمال"].map(c=>`<div class="choice ${s.flightClass===c?'on':''}" data-fc="${c}">${c}</div>`).join('')}</div>
  </label>
  <label class="field"><span>تاريخ بدء الرحلة</span><input type="date" id="startDate" value="${s.startDate}"></label>
  <label class="field"><span>اختر الباكج</span>
    <div class="pkg-grid">${PACKAGES.map(p=>`<div class="pkg ${s.package&&s.package.days===p.days?'on':''}" data-pk="${p.days}"><b>${p.days} أيام</b><small>${p.tours} جولات مقترحة</small></div>`).join('')}</div>
  </label>
  ${s.package?`
  <div class="day-editor">
    <span style="font-weight:600;font-size:.9rem">توزيع الأيام على المدن (قابل للتعديل)</span>
    ${cities.map(c=>`<div class="day-row"><span>${c}</span><input type="number" min="1" data-day="${c}" value="${s.dayMap[c]}"></div>`).join('')}
    <div class="day-total ${total===s.package.days?'':'bad'}" id="dayTotal">مجموع الأيام: ${total} / ${s.package.days}</div>
  </div>`:''}
  ${multiCityCountries().length? `<div class="transport-block">
    <div class="subhead">التنقل الداخلي بين المدن</div>
    ${multiCityCountries().map(([country])=>`
      <div style="margin-bottom:10px">
        <div class="tb-title">${country}</div>
        <div class="choice-row">${TRANSPORT_MODES.map(m=>`<div class="choice ${s.transport[country]===m?'on':''}" data-tr="${country}|${m}">${m}</div>`).join('')}</div>
      </div>`).join('')}
  </div>`:''}
  ${s.package? budgetWidgetHTML():''}
  <div class="nav-btns"><button class="ghost" id="back">رجوع</button><button class="primary" id="next" ${(!s.origin||!s.startDate||!s.package||total!==(s.package&&s.package.days))?'disabled':''}>التالي</button></div>`;
}

function step4(){
  return `
  <h2 class="step-title">الاستقبال والإقامة</h2>
  <p class="step-sub">الخطوة 4 من 6</p>
  <label class="field"><span>خدمة الاستقبال والتوديع بالمطار</span>
    <div class="choice-row">
      <div class="choice ${s.reception===true?'on':''}" data-rec="1">نعم، أريدها</div>
      <div class="choice ${s.reception===false?'on':''}" data-rec="0">لا، لا أريد</div>
    </div>
  </label>
  <label class="field"><span>نوع الإقامة (يمكن اختيار أكثر من نوع)</span>
    <div class="choice-row">${STAY_TYPES.map(t=>`<div class="choice ${s.stayTypes.includes(t)?'on':''}" data-stay="${t}">${t}</div>`).join('')}</div>
  </label>
  <label class="field"><span>تصنيف الإقامة (يمكن اختيار أكثر من تصنيف)</span>
    <div class="choice-row">${[3,4,5].map(n=>`<div class="choice ${s.starsSel.includes(n)?'on':''}" data-star="${n}">${'⭐'.repeat(n)}</div>`).join('')}</div>
  </label>
  <div class="subhead">خدمات إضافية اختيارية</div>
  <div class="addon-grid">${ADDONS.map(a=>`<div class="addon ${s.addons.includes(a)?'on':''}" data-addon="${a}"><span class="box"></span><span>${a}</span></div>`).join('')}</div>
  <div class="nav-btns"><button class="ghost" id="back">رجوع</button><button class="primary" id="next" ${(s.reception===null||s.stayTypes.length===0||s.starsSel.length===0)?'disabled':''}>التالي</button></div>`;
}

function step5(){
  const opts=["أماكن حيوية ومزدحمة","أماكن هادئة وخالية","مدن متطورة وتكنولوجيا","طبيعة وغابات","شواطئ وبحار","حفلات وأنشطة صاخبة","وجهات رومانسية هادئة"];
  return `
  <h2 class="step-title">تفضيلات الجولات وذوقك</h2>
  <p class="step-sub">الخطوة 5 من 6</p>
  <label class="field"><span>لغة المرشد السياحي</span>
    <div class="choice-row">${["اللغة العربية","اللغة الإنجليزية"].map(l=>`<div class="choice ${s.guideLang===l?'on':''}" data-lang="${l}">${l}</div>`).join('')}</div>
  </label>
  <label class="field"><span>نوع الجولات</span>
    <div class="choice-row">${["جولات خاصة Private","جولات ضمن مجموعة Group"].map(t=>`<div class="choice ${s.tourType===t?'on':''}" data-tourtype="${t}">${t}</div>`).join('')}</div>
  </label>
  <div class="subhead">ذوقك واهتماماتك</div>
  <div class="pref-grid">${opts.map(o=>`<div class="choice ${s.prefs.includes(o)?'on':''}" data-pref="${o}">${o}</div>`).join('')}</div>
  <div class="nav-btns"><button class="ghost" id="back">رجوع</button><button class="primary" id="next">عرض ملخص الرحلة</button></div>`;
}

function step6(){
  const cities=cityList();
  return `
  <h2 class="step-title">ملخص رحلتك</h2>
  <p class="step-sub">راجع التفاصيل قبل التواصل مع فريقنا</p>
  <div class="summary-block">
    <h3>البيانات الأساسية</h3>
    <div class="summary-row"><span>الجنسية</span><span>${s.nationality}</span></div>
    <div class="summary-row"><span>نوع الرحلة</span><span>${s.tripType}</span></div>
    <div class="summary-row"><span>عدد المسافرين</span><span>${s.adults} بالغين، ${s.children} أطفال</span></div>
    <div class="summary-row"><span>الميزانية المخصصة من العميل</span><span>$${(+s.budget).toLocaleString()}</span></div>
  </div>
  <div class="summary-block">
    <h3>الطيران والباكج</h3>
    <div class="summary-row"><span>الانطلاق من</span><span>${s.origin}</span></div>
    <div class="summary-row"><span>درجة الطيران</span><span>${s.flightClass}</span></div>
    <div class="summary-row"><span>تاريخ البداية</span><span>${s.startDate}</span></div>
    <div class="summary-row"><span>الباكج</span><span>${s.package.days} يوم / ${s.package.tours} جولات</span></div>
  </div>
  <div class="summary-block">
    <h3>توزيع الرحلة على المدن</h3>
    ${cities.map(c=>`<div class="itin-city"><span>${c}</span><b>${s.dayMap[c]} أيام · ${toursFor(c)} جولات</b></div>`).join('')}
  </div>
  ${multiCityCountries().length?`<div class="summary-block"><h3>التنقل الداخلي</h3>
    ${multiCityCountries().map(([country])=>`<div class="summary-row"><span>${country}</span><span>${s.transport[country]||'—'}</span></div>`).join('')}
  </div>`:''}
  <div class="summary-block">
    <h3>الإقامة والاستقبال</h3>
    <div class="summary-row"><span>الاستقبال بالمطار</span><span>${s.reception?'نعم':'لا'}</span></div>
    <div class="summary-row"><span>نوع الإقامة</span><span class="summary-tags">${s.stayTypes.join('، ')}</span></div>
    <div class="summary-row"><span>التصنيف</span><span>${s.starsSel.map(n=>'⭐'.repeat(n)).join('  ')}</span></div>
    ${s.addons.length?`<div class="summary-row"><span>خدمات إضافية</span><span class="summary-tags">${s.addons.join('، ')}</span></div>`:''}
  </div>
  <div class="summary-block">
    <h3>الجولات</h3>
    <div class="summary-row"><span>لغة المرشد</span><span>${s.guideLang||'—'}</span></div>
    <div class="summary-row"><span>نوع الجولة</span><span>${s.tourType||'—'}</span></div>
  </div>
  ${s.prefs.length?`<div class="summary-block"><h3>التفضيلات</h3><div class="summary-row"><span>${s.prefs.join(' · ')}</span><span></span></div></div>`:''}
  ${budgetWidgetHTML()}
  <div class="note">سيتواصل معك فريق مجموعة النخبة سفر لتأكيد الأسعار وتفاصيل الجولات النهائية.</div>
  <div class="nav-btns"><button class="ghost" id="back">تعديل</button><button class="primary" id="printBtn">تحميل PDF</button></div>
  ${PHONE_NUMBERS.map((p,i)=>`<div class="nav-btns"><button class="primary wa-btn" data-wa="${p.number}">إرسال عبر واتساب — ${p.label}</button></div>`).join('')}`;
}

function wire(){
  document.getElementById('next')?.addEventListener('click',()=>go(1));
  document.getElementById('back')?.addEventListener('click',()=>go(-1));
  document.getElementById('printBtn')?.addEventListener('click',()=>window.print());
  document.querySelectorAll('[data-wa]').forEach(btn=>btn.addEventListener('click',()=>{
    window.open('https://wa.me/'+btn.dataset.wa+'?text='+encodeURIComponent(buildWhatsAppMessage()),'_blank');
  }));
  document.getElementById('nat')?.addEventListener('change',e=>{s.nationality=e.target.value;render();});
  document.getElementById('budget')?.addEventListener('input',e=>{s.budget=Math.max(1500,+e.target.value||1500);});
  document.getElementById('budget')?.addEventListener('change',e=>{e.target.value=s.budget;});
  document.querySelectorAll('[data-v]').forEach(n=>n.addEventListener('click',()=>{s.tripType=n.dataset.v;render();}));
  document.querySelectorAll('[data-adj]').forEach(b=>b.addEventListener('click',()=>{
    const k=b.dataset.adj,d=+b.dataset.d; s[k]=Math.max(k==='adults'?1:0,s[k]+d); render();
  }));
  document.querySelectorAll('[data-c]').forEach(c=>c.addEventListener('click',()=>{
    const v=c.dataset.c; const i=s.cities.indexOf(v);
    if(i>-1) s.cities.splice(i,1); else s.cities.push(v);
    render();
  }));
  document.getElementById('origin')?.addEventListener('input',e=>{s.origin=e.target.value; document.getElementById('next').disabled=!(s.origin&&s.startDate&&s.package&&dayTotal()===s.package.days);});
  document.querySelectorAll('[data-fc]').forEach(c=>c.addEventListener('click',()=>{s.flightClass=c.dataset.fc;render();}));
  document.getElementById('startDate')?.addEventListener('input',e=>{s.startDate=e.target.value; document.getElementById('next').disabled=!(s.origin&&s.startDate&&s.package&&dayTotal()===s.package.days);});
  document.querySelectorAll('[data-pk]').forEach(p=>p.addEventListener('click',()=>{
    s.package=PACKAGES.find(pp=>pp.days==p.dataset.pk); s.dayMap={}; ensureDayMap(); render();
  }));
  document.querySelectorAll('[data-day]').forEach(inp=>inp.addEventListener('input',e=>{
    s.dayMap[e.target.dataset.day]=+e.target.value||0;
    const total=dayTotal();
    document.getElementById('dayTotal').textContent=`مجموع الأيام: ${total} / ${s.package.days}`;
    document.getElementById('dayTotal').className='day-total'+(total===s.package.days?'':' bad');
    document.getElementById('next').disabled = total!==s.package.days;
  }));
  document.querySelectorAll('[data-rec]').forEach(r=>r.addEventListener('click',()=>{s.reception=r.dataset.rec==='1';render();}));
  document.querySelectorAll('[data-stay]').forEach(r=>r.addEventListener('click',()=>{
    const v=r.dataset.stay; const i=s.stayTypes.indexOf(v);
    if(i>-1) s.stayTypes.splice(i,1); else s.stayTypes.push(v);
    render();
  }));
  document.querySelectorAll('[data-star]').forEach(r=>r.addEventListener('click',()=>{
    const v=+r.dataset.star; const i=s.starsSel.indexOf(v);
    if(i>-1) s.starsSel.splice(i,1); else s.starsSel.push(v);
    render();
  }));
  document.querySelectorAll('[data-addon]').forEach(r=>r.addEventListener('click',()=>{
    const v=r.dataset.addon; const i=s.addons.indexOf(v);
    if(i>-1) s.addons.splice(i,1); else s.addons.push(v);
    render();
  }));
  document.querySelectorAll('[data-tr]').forEach(r=>r.addEventListener('click',()=>{
    const [country,mode]=r.dataset.tr.split('|'); s.transport[country]=mode; render();
  }));
  document.querySelectorAll('[data-lang]').forEach(r=>r.addEventListener('click',()=>{s.guideLang=r.dataset.lang;render();}));
  document.querySelectorAll('[data-tourtype]').forEach(r=>r.addEventListener('click',()=>{s.tourType=r.dataset.tourtype;render();}));
  document.querySelectorAll('[data-pref]').forEach(r=>r.addEventListener('click',()=>{
    const v=r.dataset.pref; const i=s.prefs.indexOf(v);
    if(i>-1) s.prefs.splice(i,1); else s.prefs.push(v);
    r.classList.toggle('on');
  }));
}
render();
</script>
</body>
</html>
